name: Build and test
on: [push, pull_request]
jobs:
  firmware-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio test -e native
      - run: pio run -e native
      - run: pio run -e esp32dev
