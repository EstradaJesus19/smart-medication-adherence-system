[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<main.cpp>

; Standalone physical test: external 10 kOhm pull-up on GPIO25,
; LED and 220 Ohm series resistor on GPIO26. No medication logic.
[env:reed_led_test]
extends = env:esp32dev
build_src_filter = +<reed_led_test.cpp>

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Wall -Wextra -Wpedantic
build_src_filter = +<native_main.cpp>
test_framework = unity
test_build_src = no
lib_deps = throwtheswitch/Unity@2.6.0

; One real lid, manual dose trigger, real elapsed time.
[env:single_lid_test]
extends = env:esp32dev
build_src_filter = +<single_lid_test.cpp>

; Four real lids and independent pending-dose indicators.
[env:four_lid_test]
extends = env:esp32dev
build_src_filter = +<four_lid_test.cpp>

; Battery-free, standalone I2C RTC test. Uses framework Wire; no extra libraries.
[env:rtc_test]
extends = env:esp32dev
build_src_filter = +<rtc_test.cpp>

; Explicitly armed daily RTC schedule and four physical lids; volatile history.
[env:scheduled_lid_test]
extends = env:esp32dev
build_src_filter = +<scheduled_lid_test.cpp>
