[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<main.cpp>

; Standalone physical test: external 10 kOhm pull-up on GPIO25,
; LED and 220 Ohm series resistor on GPIO26. No medication logic.
[env:reed_led_test]
extends = env:esp32dev
build_src_filter = +<reed_led_test.cpp>

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Wall -Wextra -Wpedantic
build_src_filter = +<native_main.cpp>
test_framework = unity
test_build_src = no

; One real lid, manual dose trigger, real elapsed time.
[env:single_lid_test]
extends = env:esp32dev
build_src_filter = +<single_lid_test.cpp>

; Four real lids and independent pending-dose indicators.
[env:four_lid_test]
extends = env:esp32dev
build_src_filter = +<four_lid_test.cpp>

; Battery-free, standalone I2C RTC test. Uses framework Wire; no extra libraries.
[env:rtc_test]
extends = env:esp32dev
build_src_filter = +<rtc_test.cpp>

; Explicitly armed daily RTC schedule and four physical lids; volatile history.
[env:scheduled_lid_test]
extends = env:esp32dev
build_src_filter = +<scheduled_lid_test.cpp>

; Standalone provisional SSD1306 128x64 display test; dependencies local to this env.
[env:oled_test]
extends = env:esp32dev
build_src_filter = +<oled_test.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4

; Shared bus RTC calendar reads plus OLED display, no RTC time setting.
[env:rtc_oled_test]
extends = env:oled_test
build_src_filter = +<rtc_oled_test.cpp>

; Standalone D4 momentary button check, no refill state changes yet.
[env:refill_button_test]
extends = env:esp32dev
build_src_filter = +<refill_button_test.cpp>

; Separate RTC schedule + physical refill button integration; serial status only.
[env:scheduled_refill_test]
extends = env:esp32dev
build_src_filter = +<scheduled_refill_test.cpp>

; Isolated short DC beep via PN2222A; retains series current limiting and diode.
[env:buzzer_test]
extends = env:esp32dev
build_src_filter = +<buzzer_test.cpp>

; Bounded repeating bench alert with physical VP/GPIO36 silence button.
[env:buzzer_silence_test]
extends = env:esp32dev
build_src_filter = +<buzzer_silence_test.cpp>

; Separate scheduled sessions with refill and session-only audio silence.
[env:scheduled_alert_test]
extends = env:esp32dev
build_src_filter = +<scheduled_alert_test.cpp>

; Full bench integration with bounded OLED clock transfers; no framebuffer flush.
[env:scheduled_oled_test]
extends = env:esp32dev
build_src_filter = +<scheduled_oled_test.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
